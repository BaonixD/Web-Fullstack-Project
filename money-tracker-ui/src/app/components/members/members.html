<app-sidebar />

<main class="page-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Мемберы</h1>
      <p class="page-subtitle">Управление участниками департамента</p>
    </div>
  </div>

  @if (members.length === 0) {
    <p style="color: var(--text-muted); margin-top: 20px;">Мемберов пока нет.</p>
  }

  <div class="members-grid fade-in">
    @for (m of members; track m.id; let i = $index) {
      <div class="member-card">
        <div class="member-avatar" [style.background]="getGradient(i)">{{ getInitials(m) }}</div>
        <h4>{{ getDisplayName(m) }}</h4>
        <div class="member-role">{{ m.department || 'Не указано' }}</div>
        <div class="role-badge badge-member">Мембер</div>
      </div>
    }
  </div>
</main>
