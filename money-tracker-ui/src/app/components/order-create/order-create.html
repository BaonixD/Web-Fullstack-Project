<app-sidebar />

<main class="page-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Новый заказ</h1>
      <p class="page-subtitle">Опишите что нужно снять или записать</p>
    </div>
  </div>

  <div class="order-form-card fade-in">
    <h3>Выберите формат</h3>
    <div class="format-grid">
      @for (fmt of formats; track fmt.label; let i = $index) {
        <button class="format-option" [class.selected]="selectedFormat === i" (click)="selectFormat(i)">
          <div class="fmt-icon">{{ fmt.icon }}</div>
          <div class="fmt-label">{{ fmt.label }}</div>
          <div class="fmt-desc">{{ fmt.desc }}</div>
        </button>
      }
    </div>

    <div class="form-group">
      <label>Тип</label>
      <select class="form-input" [(ngModel)]="orderType">
        <option value="video">Видеосъёмка</option>
        <option value="photo">Фотосъёмка</option>
        <option value="design">Дизайн</option>
      </select>
    </div>

    <div class="form-group">
      <label>Название заказа</label>
      <input type="text" class="form-input" placeholder="Например: Подкаст про IT в Казахстане" [(ngModel)]="orderTitle">
    </div>

    <div class="form-group">
      <label>Подробности</label>
      <textarea class="form-input" placeholder="Опишите что нужно, стиль, локацию, пожелания..." [(ngModel)]="orderDetails"></textarea>
    </div>

    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <button class="btn btn-primary btn-lg submit-btn" (click)="submit()">
      🚀 Отправить заказ
    </button>
  </div>
</main>
