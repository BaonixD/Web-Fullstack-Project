@if (svc.state().open) {
  <div class="confirm-backdrop" (click)="svc.cancel()">
    <div class="confirm-dialog" (click)="$event.stopPropagation()">
      <h3 class="confirm-title">{{ svc.state().title }}</h3>
      @if (svc.state().message) {
        <p class="confirm-message">{{ svc.state().message }}</p>
      }
      <div class="confirm-actions">
        <button class="btn btn-ghost btn-sm" (click)="svc.cancel()">{{ svc.state().cancelText }}</button>
        <button
          class="btn btn-sm"
          [class.btn-danger]="svc.state().tone === 'danger'"
          [class.btn-primary]="svc.state().tone !== 'danger'"
          (click)="svc.confirm()">
          {{ svc.state().confirmText }}
        </button>
      </div>
    </div>
  </div>
}
